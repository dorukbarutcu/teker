name: teker
description: "Teker - E-Bike Navigation with Android Auto and Google Assistant Actions"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.3
  file_picker: ^13.4.0
  xml: ^6.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
